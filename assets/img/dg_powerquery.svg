<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210"><rect width="1000" height="210" fill="white"/><text x="16" y="30" font-family="Poppins, Lato, sans-serif" font-size="19" font-weight="600" fill="#123A63">Le traitement de données avec Power Query</text><line x1="131.75" y1="82" x2="868.25" y2="82" stroke="#DCE5EF" stroke-width="3"/><circle cx="131.75" cy="82" r="21" fill="#7C5AE0"/><text x="131.75" y="90" font-family="Poppins, Lato, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">1</text><text x="131.75" y="132" font-family="Poppins, Lato, sans-serif" font-size="17" font-weight="600" fill="#123A63" text-anchor="middle">Importer</text><text x="131.75" y="155" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">Rassembler des sources de</text><text x="131.75" y="174" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">données hétérogènes.</text><circle cx="377.25" cy="82" r="21" fill="#7C5AE0"/><text x="377.25" y="90" font-family="Poppins, Lato, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">2</text><text x="377.25" y="132" font-family="Poppins, Lato, sans-serif" font-size="17" font-weight="600" fill="#123A63" text-anchor="middle">Nettoyer</text><text x="377.25" y="155" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">Supprimer erreurs,</text><text x="377.25" y="174" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">doublons et valeurs</text><text x="377.25" y="193" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">aberrantes.</text><circle cx="622.75" cy="82" r="21" fill="#7C5AE0"/><text x="622.75" y="90" font-family="Poppins, Lato, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">3</text><text x="622.75" y="132" font-family="Poppins, Lato, sans-serif" font-size="17" font-weight="600" fill="#123A63" text-anchor="middle">Transformer</text><text x="622.75" y="155" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">Restructurer les tables</text><text x="622.75" y="174" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">pour les rendre</text><text x="622.75" y="193" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">analysables.</text><circle cx="868.25" cy="82" r="21" fill="#7C5AE0"/><text x="868.25" y="90" font-family="Poppins, Lato, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">4</text><text x="868.25" y="132" font-family="Poppins, Lato, sans-serif" font-size="17" font-weight="600" fill="#123A63" text-anchor="middle">Automatiser</text><text x="868.25" y="155" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">Rejouer le traitement sur</text><text x="868.25" y="174" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">de nouvelles données.</text></svg>