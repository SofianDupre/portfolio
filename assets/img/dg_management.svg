<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200"><rect width="1000" height="200" fill="white"/><text x="16" y="30" font-family="Poppins, Lato, sans-serif" font-size="19" font-weight="600" fill="#123A63">Les quatre fonctions du management</text><rect x="16.0" y="56" width="231.5" height="132" rx="6" fill="#F5F8FC"/><rect x="16.0" y="56" width="231.5" height="5" rx="2.5" fill="#1F5FD0"/><text x="32.0" y="90" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="600" fill="#123A63">Planifier</text><text x="32.0" y="114" font-family="Lato, sans-serif" font-size="13.5" fill="#56687D">Définir des objectifs et des</text><text x="32.0" y="132" font-family="Lato, sans-serif" font-size="13.5" fill="#56687D">stratégies pour les atteindre.</text><rect x="261.5" y="56" width="231.5" height="132" rx="6" fill="#F5F8FC"/><rect x="261.5" y="56" width="231.5" height="5" rx="2.5" fill="#1F5FD0"/><text x="277.5" y="90" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="600" fill="#123A63">Organiser</text><text x="277.5" y="114" font-family="Lato, sans-serif" font-size="13.5" fill="#56687D">Mettre en place les ressources</text><text x="277.5" y="132" font-family="Lato, sans-serif" font-size="13.5" fill="#56687D">et les processus.</text><rect x="507.0" y="56" width="231.5" height="132" rx="6" fill="#F5F8FC"/><rect x="507.0" y="56" width="231.5" height="5" rx="2.5" fill="#1F5FD0"/><text x="523.0" y="90" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="600" fill="#123A63">Diriger</text><text x="523.0" y="114" font-family="Lato, sans-serif" font-size="13.5" fill="#56687D">Mobiliser et animer les</text><text x="523.0" y="132" font-family="Lato, sans-serif" font-size="13.5" fill="#56687D">équipes.</text><rect x="752.5" y="56" width="231.5" height="132" rx="6" fill="#F5F8FC"/><rect x="752.5" y="56" width="231.5" height="5" rx="2.5" fill="#1F5FD0"/><text x="768.5" y="90" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="600" fill="#123A63">Contrôler</text><text x="768.5" y="114" font-family="Lato, sans-serif" font-size="13.5" fill="#56687D">Suivre et ajuster les</text><text x="768.5" y="132" font-family="Lato, sans-serif" font-size="13.5" fill="#56687D">performances.</text></svg>