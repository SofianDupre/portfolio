<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210"><rect width="1000" height="210" fill="white"/><text x="16" y="30" font-family="Poppins, Lato, sans-serif" font-size="19" font-weight="600" fill="#123A63">Le processus de recrutement en agence d’intérim</text><line x1="131.75" y1="82" x2="868.25" y2="82" stroke="#DCE5EF" stroke-width="3"/><circle cx="131.75" cy="82" r="21" fill="#17879E"/><text x="131.75" y="90" font-family="Poppins, Lato, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">1</text><text x="131.75" y="132" font-family="Poppins, Lato, sans-serif" font-size="17" font-weight="600" fill="#123A63" text-anchor="middle">Commande client</text><text x="131.75" y="155" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">Poste, lieu, horaires,</text><text x="131.75" y="174" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">rémunération et profil</text><text x="131.75" y="193" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">attendu.</text><circle cx="377.25" cy="82" r="21" fill="#17879E"/><text x="377.25" y="90" font-family="Poppins, Lato, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">2</text><text x="377.25" y="132" font-family="Poppins, Lato, sans-serif" font-size="17" font-weight="600" fill="#123A63" text-anchor="middle">Tri des candidatures</text><text x="377.25" y="155" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">Présélection sur</text><text x="377.25" y="174" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">Talentplug et boîte mail</text><text x="377.25" y="193" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">agence.</text><circle cx="622.75" cy="82" r="21" fill="#17879E"/><text x="622.75" y="90" font-family="Poppins, Lato, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">3</text><text x="622.75" y="132" font-family="Poppins, Lato, sans-serif" font-size="17" font-weight="600" fill="#123A63" text-anchor="middle">Préqualification</text><text x="622.75" y="155" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">Appel : disponibilité,</text><text x="622.75" y="174" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">intérêt, adéquation au</text><text x="622.75" y="193" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">poste.</text><circle cx="868.25" cy="82" r="21" fill="#17879E"/><text x="868.25" y="90" font-family="Poppins, Lato, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">4</text><text x="868.25" y="132" font-family="Poppins, Lato, sans-serif" font-size="17" font-weight="600" fill="#123A63" text-anchor="middle">Mise en poste</text><text x="868.25" y="155" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">Contrat, feuille de</text><text x="868.25" y="174" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">présence et consignes de</text><text x="868.25" y="193" font-family="Lato, sans-serif" font-size="14" fill="#56687D" text-anchor="middle">mission.</text></svg>